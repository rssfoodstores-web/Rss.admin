name: WhatsApp campaign regression
on:
  push:
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx eslint src/lib/whatsapp-campaign-progress.ts src/lib/whatsapp-campaign-worker.ts src/app/dashboard/whatsapp/audience-actions.ts src/app/dashboard/whatsapp/SecureCsvCampaignWorkspace.tsx
